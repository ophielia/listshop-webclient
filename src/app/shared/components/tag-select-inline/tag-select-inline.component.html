



<p-autoComplete
  [(ngModel)]="autoSelectedTag"
  [suggestions]="filteredTags"
  (completeMethod)="filterTags($event)"
  optionLabel="name"
  inputStyleClass="autocomplete-input"
  panelStyleClass="autocomplete-panel"
  styleClass="ls-autocomplete"
  focus=true
  [delay]="200"
  (onSelect)="bingo($event.value)"
  (keyup.enter)="checkSearchEnter(focusanchor)"
  (keyup.escape)="cancelSelectTag()"
  placeholder="{{placeholderText}}" [minLength]="1" #focusanchor>
  <ng-template let-autoSelectedTag pTemplate="item">

    @if (isRatingTag(autoSelectedTag.tag_type)) {
      <div style="font-size:16px;float:right;margin:10px 10px 0 0">{{autoSelectedTag.name}}
        <img src="../../../../assets/images/listshop/elements/ratingstars/{{autoSelectedTag.power}}stars.png" style="height:22px;"/>
      </div>
    }
    @if (!isRatingTag(autoSelectedTag.tag_type)) {
      <div style="font-size:16px;float:right;margin:10px 10px 0 0">{{autoSelectedTag.name}}</div>
    }

  </ng-template>
</p-autoComplete>






@if (showAddTags) {
  <div class="ls-panel " >
    <div>
      @for (ttype of allTagTypes; track ttype) {
        @if (isIncluded(ttype)) {
          <div class="add-link"
            (click)="add(ttype)">
            Create New {{ttype}}
          </div>
        }
      }
    </div>
    <div  (click)="cancelAdd()" class="cancel-link">
      Cancel
    </div>
  </div>
}
