@if (message) {
  <div class="modal" tabindex="-1" role="dialog" style="display:block!important">
    <div class="modal-dialog custom-alert" role="document">
      <div class="modal-content">
        @if (message?.type == 'confirm') {
          <div class="modal-body">
            <div class="row">
              <div class="col-md-12">
                <p class="text-center confirm-message">{{message.text}}</p>
              </div>
            </div>
            <div class="row">
              <div class="col-md-12">
                <p class="confirm-button">
                  <a class="me-2" (click)="message.yesFn()">
                    <button class="btn btn-yes">Yes</button>
                  </a>
                  <a (click)="message.noFn()">
                    <button class="btn btn-no">No</button>
                  </a>
                </p>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
}
