
<table>
  <tr>
    <td>
      <p-autoComplete [(ngModel)]="autoSelectedDish"
        [suggestions]="filteredDishList"
        (completeMethod)="filterDishes($event)"
        optionLabel="name"
        inputStyleClass="autocomplete-input"
        panelStyleClass="autocomplete-panel"
        styleClass="ls-autocomplete"
        (onSelect)="bingo($event.value)"

        placeholder="{{showText}}" [minLength]="1" > -->
      </p-autoComplete>
    </td>
    @if (showCancelButton) {
      <td  class="cancel-button" (click)="cancelDishInput()">X</td>
    }
    @if (!showCancelButton) {
      <td class="no-cancel-button"></td>
    }
    <tr>
    </table>
