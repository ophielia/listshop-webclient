
<!--single list element start-->
<div class="ls-card" >
  <div (click)="selectADish()">
    <div class="ls-dish-element-title" >{{dish.name}}
    </div>
    @if (fullDisplay && hasDescription()) {
      <div class="ls-dish-description">{{dish.description}}</div>
    }
    @if (hasReference()) {
      <div>Ref: {{dish.reference}}</div>
    }
  </div>
  <div class="ls-card-link-block">
    <a class="ls-card-link" (click)="selectDishFromLink()">{{selectLabel}}</a>
    @if (showViewLink) {
      <a class="ls-card-link" (click)="editDish()"  >edit</a>
    }
  </div>
  <div class="clearfix"></div>
</div>
<!--single list element end-->
