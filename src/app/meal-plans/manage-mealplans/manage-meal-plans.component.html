<!--title start-->
<div class="titlebar-bg">
  <div class="container">
    <div class="row">
      <div class="col-md-6 col-sm-6 col-text-center d-align-left">
        <h2 class="title"><span>Meal Plans</span></h2>
      </div>
      <div class="col-md-6 col-sm-6 col-text-end">
        <button type="button" class="create-meal-plan" (click)="createMealPlan()"
          [disabled]="isCreatingMealPlan" [attr.aria-busy]="isCreatingMealPlan" aria-label="Create meal plan">
          <img src="../../../assets/images/listshop/icons/orangeround/orangeadd.png" alt=""></button>
        </div>
      </div>
    </div>
  </div>
  <!--title end -->
  <!--content start-->
  <section>
    <div class="container">
      @if (creationError) {
        <div class="alert alert-danger" role="alert">{{ creationError }}</div>
      }
      @if (isLoading) {
        <div class="col-md-12 " class="loading-box">
          <div class="loading-text">loading meal plans...</div>
        </div>
      }
      @if (!isLoading && mealPlans.length == 0) {
        <div
        class="ls-flat-card empty-list">No meal plans currently.</div>
      }
      @if (!isLoading && mealPlans.length > 0) {
        <div class="row">
          <div class="col-md-12 ">
            <div class="row ">
              @for (plan of mealPlans; track plan) {
                <div
                  class="col-lg-4 col-md-6">
                  <!-- single list element -->
                  <app-single-plan-element
                    [planName]="plan.name"
                    [planId]="plan.meal_plan_id"
                    (delete)="deleteMealPlan($event)"
                  (edit)="editMealPlan($event)"></app-single-plan-element>
                  <!-- single list element -->
                </div>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </section>
  <!--content End-->

  <app-confirm-dialog></app-confirm-dialog>
